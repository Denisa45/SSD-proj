<div class="timer-container">

  <h1>{{ isBreak ? 'Break Time' : 'Study Timer' }}</h1>

  <div class="settings-container" style="display: flex; gap: 20px; justify-content: center; margin-bottom: 20px;">
    
    <div class="setting-group">
      <span>Study: <strong>{{ studyDuration }} m</strong></span>
      <div>
        <button (click)="adjustStudyTime(1)">+</button>
        <button (click)="adjustStudyTime(-1)">-</button>
      </div>
    </div>

    <div class="setting-group">
      <span>Break: <strong>{{ breakDuration }} m</strong></span>
      <div>
        <button (click)="adjustBreakTime(1)">+</button>
        <button (click)="adjustBreakTime(-1)">-</button>
      </div>
    </div>

  </div>
  <div class="time">{{ formattedTime }}</div>

  <div class="controls">
    <button (click)="startTimer()" [disabled]="isRunning">Start</button>
    <button (click)="pauseTimer()" [disabled]="!isRunning">Pause</button>
    <button (click)="resetTimer()">Reset</button>
    
    <button *ngIf="isBreak" (click)="skipBreak()" class="skip-btn">Skip Break</button>
  </div>

  <h2>Session History</h2>

  <div *ngIf="sessionHistory.length === 0">
    No study sessions yet.
  </div>

  <ul>
    <li *ngFor="let s of sessionHistory">
      <strong>{{ s.type }}</strong> — {{ s.duration }} ({{ s.date }})
    </li>
  </ul>

  <button class="clear" (click)="clearHistory()">Clear History</button>

</div>
