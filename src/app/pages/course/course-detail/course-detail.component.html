<div *ngIf="course; else loading" class="course-detail-container">
  <!-- Header -->
  <div class="course-header">
    <h2 class="course-title">{{ course.name }}</h2>
    <p class="course-desc">
      {{ course.description || 'No description available.' }}
    </p>

    <div class="course-actions">
      <button class="btn edit" (click)="editCourse()">
        ✏️ Edit
      </button>
      <button class="btn delete" (click)="deleteCourse()">
        🗑️ Delete
      </button>
    </div>
  </div>

  <!-- Tasks Section -->
  <div class="tasks-section">
    <h3>
      Tasks
      <span class="progress">
        {{ completedTasksCount }} / {{ totalTasksCount }} completed
      </span>
    </h3>

    <ul class="task-list" *ngIf="course.tasks && course.tasks.length > 0; else noTasks">
      <li
        *ngFor="let task of course.tasks"
        class="task-item"
        [class.done]="task.done"
      >
        <label>
          <input
            type="checkbox"
            [checked]="task.done"
            (change)="toggleTask(task.name)"
          />
          <span>{{ task.name }}</span>
        </label>
        <button class="delete-task-btn" (click)="removeTask(task.name)">
          ✖
        </button>
      </li>
    </ul>

    <ng-template #noTasks>
      <p class="empty-tasks">No tasks yet. Add your first one below!</p>
    </ng-template>

    <div class="add-task">
      <input
        type="text"
        [(ngModel)]="newTask"
        placeholder="Enter new task..."
      />
      <button (click)="addTask()" class="btn add">➕ Add Task</button>
    </div>
  </div>
    <!-- Materials Section -->
  <div class="materials-section" *ngIf="course.materials?.length">
  <h3>📚 Materials</h3>
  <ul class="material-list">
    <li *ngFor="let mat of course.materials">
      <a [href]="'http://localhost:3000' + mat.url" target="_blank" download>
        {{ mat.name }}
      </a>
      <button class="btn-icon delete" (click)="removeMaterial(mat.name)">✖</button>
    </li>
  </ul>
</div>


<h3>Grades</h3>

<div class="grade-input">
  <input 
    type="number" 
    min="1" 
    max="10" 
    [(ngModel)]="newGrade" 
    placeholder="Add grade (1-10)"
  />
  <button (click)="addGrade()">Add</button>
</div>

<ul class="grade-list">
  <li *ngFor="let g of course.grades; let i = index">
    {{ g.value }}
    <button (click)="removeGrade(i)">✖</button>
  </li>
</ul>

<p><strong>Average:</strong> {{ gradeAverage }}</p>



  <!-- Upload New Material -->
  <div class="upload-material">
  <input type="file" #fileInput />
  <button (click)="uploadMaterial(fileInput.files)">Upload File</button>
  </div>



</div>

<ng-template #loading>
  <div class="loading">
    <p>Loading course details...</p>
  </div>
</ng-template>
